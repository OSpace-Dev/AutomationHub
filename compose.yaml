services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-automationhub}
      POSTGRES_USER: ${PGUSER:-automationhub}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set}
    volumes:
      - ../../shared/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  automation-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: automation-hub:${AUTOMATION_HUB_VERSION:-local}
    restart: unless-stopped
    env_file:
      - ../../shared/.env
    environment:
      STORAGE_DRIVER: postgres
    ports:
      - "${AUTOMATION_HUB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
